<script>
var T={"en": {"title": "Beit Al-Ezz, Brand Identity", "kick": "Brand Identity", "back": "Back to portfolio", "intro_h": "The project", "intro": "A brand identity for Beit Al-Ezz, a home-cooked food brand. The logo is a house with a serving cloche, a spoon and a fork, set on a signboard plate with the Arabic name. The identity covers the logo and its versions, construction, safe zone, color, Arabic typography and applications on signage, packaging and an apron.", "facts_h": "Project facts", "f1": "Type", "v1": "Brand identity", "f2": "Business", "v2": "Home-cooked food", "f3": "Language", "v3": "Arabic", "f4": "Typeface", "v4": "Sukar", "st_h": "The identity system", "st_s": "From the concept to the color and type.", "dt_h": "Applications", "dt_s": "The logo in use on signage, packaging and uniforms.", "fin_h": "The logo in use", "stages": ["Concept", "Logo colors", "Logo versions", "Construction", "Safe zone", "Primary color", "Typography"], "apps": ["Storefront sign", "Awning", "Menu stand", "Takeaway box", "Paper bag", "Salad band", "Pizza box", "Apron", "Bucket"]}, "ar": {"title": "بيت العز، هوية بصرية", "kick": "هوية بصرية", "back": "العودة إلى الأعمال", "intro_h": "عن المشروع", "intro": "هوية بصرية لبيت العز، علامة للأكل البيتي. الشعار بيت يحمل غطاء تقديم وملعقة وشوكة، على لوحة تحمل الاسم بالعربي. شملت الهوية الشعار ونسخه، وبناءه، والمساحة الآمنة، واللون، والخط العربي، وتطبيقاته على اللافتات والتغليف والمريلة.", "facts_h": "بيانات المشروع", "f1": "النوع", "v1": "هوية بصرية", "f2": "النشاط", "v2": "أكل بيتي", "f3": "اللغة", "v3": "العربية", "f4": "الخط", "v4": "سكر (Sukar)", "st_h": "نظام الهوية", "st_s": "من الفكرة إلى اللون والخط.", "dt_h": "التطبيقات", "dt_s": "الشعار أثناء الاستخدام على اللافتات والتغليف والزي.", "fin_h": "الشعار أثناء الاستخدام", "stages": ["الفكرة", "ألوان الشعار", "نسخ الشعار", "البناء", "المساحة الآمنة", "اللون الأساسي", "الخطوط"], "apps": ["لافتة المحل", "المظلة", "حامل المنيو", "علبة التيك أواي", "كيس ورقي", "شريط السلطة", "علبة البيتزا", "المريلة", "الباكيت"]}};
var lang=localStorage.getItem('lang')==='ar'?'ar':'en';
function apply(){var t=T[lang],d=document.documentElement;d.lang=lang;d.dir=lang==='ar'?'rtl':'ltr';
document.title=t.title+' | Hany Magdy';
document.querySelectorAll('[data-k]').forEach(function(e){e.textContent=t[e.dataset.k]});
document.querySelectorAll('[data-st]').forEach(function(e){e.textContent=t.stages[+e.dataset.st]});
document.querySelectorAll('[data-ap]').forEach(function(e){e.textContent=t.apps[+e.dataset.ap]});
document.getElementById('lang').textContent=lang==='ar'?'EN':'AR'}
document.getElementById('lang').onclick=function(){lang=lang==='ar'?'en':'ar';localStorage.setItem('lang',lang);apply()};
apply();
(function(){
var imgs=[].slice.call(document.querySelectorAll('main img')),cur=0;
var lb=document.createElement('div');lb.className='lb';lb.hidden=true;lb.setAttribute('role','dialog');lb.setAttribute('aria-modal','true');
lb.innerHTML='<button class="lbx" type="button" aria-label="Close">&times;</button><button class="lbp" type="button" aria-label="Previous">&#8249;</button><img alt=""><button class="lbn" type="button" aria-label="Next">&#8250;</button>';
document.body.appendChild(lb);
var big=lb.querySelector('img');
function show(i){cur=(i+imgs.length)%imgs.length;big.src=imgs[cur].currentSrc||imgs[cur].src;big.alt=imgs[cur].alt}
function open(i){show(i);lb.hidden=false;document.body.style.overflow='hidden'}
function close(){lb.hidden=true;document.body.style.overflow=''}
imgs.forEach(function(im,i){im.classList.add('zm');im.addEventListener('click',function(){open(i)})});
lb.addEventListener('click',function(e){if(e.target===lb||e.target.className==='lbx')close()});
lb.querySelector('.lbp').onclick=function(){show(cur-1)};lb.querySelector('.lbn').onclick=function(){show(cur+1)};
document.addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(cur+(document.documentElement.dir==='rtl'?1:-1));if(e.key==='ArrowRight')show(cur+(document.documentElement.dir==='rtl'?-1:1))});
})();
</script><script>
