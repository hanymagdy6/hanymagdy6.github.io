<script>
var T={"en": {"title": "Rui Brew, Brand Identity", "kick": "Brand Identity", "back": "Back to portfolio", "all_work": "All work", "contact_me": "Contact me", "intro_h": "The project", "intro": "A brand identity for Rui Brew, a premium specialty coffee brand. The identity is built around a monogram that blends the letters R, U and I into one fluid form, and around the idea of a \"Ritual\" for coffee lovers. It covers the logo and its versions, construction, minimum size, color, typography and brand imagery. A concept project, not made for a client.", "facts_h": "Project facts", "f1": "Type", "v1": "Brand identity", "f2": "Business", "v2": "Specialty coffee", "f3": "Typeface", "v3": "Butler", "f4": "Colors", "v4": "Deep Midnight #1A2935, Golden Latte #C7996F", "f5": "Year", "v5": "2026", "f6": "Project", "v6": "Concept Project", "st_h": "The identity system", "st_s": "From the idea to the logo, color and type.", "dt_h": "Brand imagery", "dt_s": "The logo in use on cups, bags and apparel.", "fin_h": "The logo in use", "stages": ["Introduction", "Typography", "Color palette", "Logo mark", "Mono color logo", "Backgrounds", "Mark construction", "Horizontal logo", "Logo construction", "Minimum size"], "apps": ["Cups, tins and apparel", "Cups and latte art", "Bags, cups and pours"]}, "ar": {"title": "Rui Brew، هوية بصرية", "kick": "هوية بصرية", "back": "العودة إلى الأعمال", "all_work": "كل الأعمال", "contact_me": "تواصل معي", "intro_h": "عن المشروع", "intro": "هوية بصرية لـ Rui Brew، علامة قهوة مختصة فاخرة. تقوم الهوية على مونوجرام يدمج الحروف R وU وI في شكل واحد انسيابي، وعلى فكرة «الطقس» لعشاق القهوة. شملت الهوية الشعار ونسخه وبناءه والحجم الأدنى والألوان والخط وصور العلامة. هذا مشروع تصوري صممته بنفسي، وليس لعميل.", "facts_h": "بيانات المشروع", "f1": "النوع", "v1": "هوية بصرية", "f2": "النشاط", "v2": "قهوة مختصة", "f3": "الخط", "v3": "Butler", "f4": "الألوان", "v4": "Deep Midnight #1A2935 و Golden Latte #C7996F", "f5": "السنة", "v5": "2026", "f6": "المشروع", "v6": "مشروع apply();
(function(){
var imgs=[].slice.call(document.querySelectorAll('main img')),cur=0;
var lb=document.createElement('div');lb.className='lb';lb.hidden=true;lb.setAttribute('role','dialog');lb.setAttribute('aria-modal','true');
lb.innerHTML='<button class="lbx" type="button" aria-label="Close">&times;</button><button class="lbp" type="button" aria-label="Previous">&#8249;</button><img alt=""><button class="lbn" type="button" aria-label="Next">&#8250;</button>';
document.body.appendChild(lb);
var big=lb.querySelector('img');
function show(i){cur=(i+imgs.length)%imgs.length;big.src=imgs[cur].currentSrc||imgs[cur].src;big.alt=imgs[cur].alt}
function open(i){show(i);lb.hidden=false;document.body.style.overflow='hidden'}
function close(){lb.hidden=true;document.body.style.overflow=''}
imgs.forEach(function(im,i){im.classList.add('zm');im.addEventListener('click',function(){open(i)})});
lb.addEventListener('click',function(e){if(e.target===lb||e.target.className==='lbx')close()});
lb.querySelector('.lbp').onclick=function(){show(cur-1)};lb.querySelector('.lbn').onclick=function(){show(cur+1)};
document.addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(cur+(document.documentElement.dir==='rtl'?1:-1));if(e.key==='ArrowRight')show(cur+(document.documentElement.dir==='rtl'?-1:1))});
})();
</script><script>
(function(){
var rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
if(rm)return;
var de=document.documentElement,vh=window.innerHeight||800;
if('IntersectionObserver' in window){
var els=[].slice.call(document.querySelectorAll('.two>div,.wrap>h2,.wrap>.sub,.stages li,.details figure,.fin figure'));
var io=new IntersectionObserver(function(en){var k=0;en.forEach(function(e){if(e.isIntersecting){var t=e.target;t.style.transitionDelay=(k*120)+'ms';k++;t.classList.add('in');io.unobserve(t)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});
els.forEach(function(el){if(el.getBoundingClientRect().top<vh*.9)return;el.classList.add('rv');io.observe(el)})}
var fin=document.querySelector('.fin figure'),tick=false;
function upd(){tick=false;var y=window.pageYOffset||0;de.style.setProperty('--py',Math.min(y*.1,260).toFixed(1)+'px');
if(fin&&innerWidth>=900){var r=fin.getBoundingClientRect(),p=(r.top+r.height/2-vh/2)/vh;p=Math.max(-1,Math.min(1,p));fin.style.transform='translate3d(0,'+(p*-14).toFixed(1)+'px,0)'}}
addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});
addEventListener('resize',function(){requestAnimationFrame(upd)});upd();
})();
